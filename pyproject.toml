[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ccmeter"
version = "1.0.1"
description = "Self-hosted token and cost tracker for Claude Code and Codex, across all your machines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "ArzMat" }]
requires-python = ">=3.15"
keywords = ["claude-code", "codex", "tokens", "usage", "cost", "dashboard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
]
# The client (agent) only needs httpx; the server and `ccmeter local` need the `server` extra.
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
server = ["fastapi>=0.140", "uvicorn>=0.40"]

[project.scripts]
ccmeter = "ccmeter.cli:main"

[project.urls]
Homepage = "https://github.com/ArzMat/ccmeter"
Issues = "https://github.com/ArzMat/ccmeter/issues"

[dependency-groups]
dev = [
    "fastapi>=0.140",
    "uvicorn>=0.40",
    "httpx2>=2.0",
    "pyright>=1.1.400",
    "pytest>=9.0",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ccmeter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
