name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv sync --extra server --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

  install:
    # the wheel, installed outside the checkout, with and without the server extra
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv build --wheel --out-dir dist
      - name: install into clean environments
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          uv venv "$RUNNER_TEMP/server-env"
          uv pip install --python "$RUNNER_TEMP/server-env" "${wheel}[server]"
          uv venv "$RUNNER_TEMP/agent-env"
          uv pip install --python "$RUNNER_TEMP/agent-env" "$wheel"
      - name: smoke test
        shell: bash
        working-directory: ${{ runner.temp }}
        # the runner's own python may be older than the 3.15 the script is written for
        run: uv run --no-project --python 3.15 python "$GITHUB_WORKSPACE/scripts/smoke_install.py" --server-env "$RUNNER_TEMP/server-env" --agent-env "$RUNNER_TEMP/agent-env"
